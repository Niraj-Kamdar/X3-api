[package]
name = "x3-cli"
description = "Voice Studio CLI: `x3 mcp` stdio shim and `x3 serve` headless server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "x3"
path = "src/main.rs"

[dependencies]
x3-core.workspace = true
x3-server.workspace = true
x3-vault.workspace = true
anyhow.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = ["server", "client", "transport-io", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
